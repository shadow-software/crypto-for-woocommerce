<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="500" viewBox="0 0 1544 500" role="img" aria-label="Accept Crypto for WooCommerce — by Shadow Software">
  <defs>
    <radialGradient id="bg" cx="16%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#12351c"/>
      <stop offset="45%" stop-color="#0b0b0b"/>
      <stop offset="100%" stop-color="#060606"/>
    </radialGradient>
    <linearGradient id="coinFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2f394"/>
      <stop offset="52%" stop-color="#8fd468"/>
      <stop offset="100%" stop-color="#5aa63c"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1544" height="500" fill="url(#bg)"/>

  <!-- faint hex lattice -->
  <g stroke="#8fd468" stroke-opacity="0.06" fill="none" stroke-width="3.5">
    <path d="M230 90 290 125v70l-60 35-60-35v-70z"/>
    <path d="M1330 320 1390 355v70l-60 35-60-35v-70z"/>
    <path d="M1230 70 1272 94v48l-42 24-42-24V94z"/>
  </g>

  <!-- Shadow hexagon + hooded mark -->
  <g transform="translate(120 130) scale(5.6)">
    <path d="M20 1.5 37 11.25v19.5L20 40.5 3 30.75v-19.5z" fill="#8fd468" opacity="0.22" filter="url(#soft)"/>
    <path d="M20 1.5 37 11.25v19.5L20 40.5 3 30.75v-19.5z" fill="#0d0d0d" stroke="#8fd468" stroke-width="2" stroke-linejoin="round"/>
    <path d="M20 11c-4.4 0-7.8 3.3-7.8 8 0 2.6 1.1 4.7 2.6 6.2-1.7 1.1-2.9 2.7-3.3 4.8h17c-.4-2.1-1.6-3.7-3.3-4.8 1.5-1.5 2.6-3.6 2.6-6.2 0-4.7-3.4-8-7.8-8z" fill="#ededed"/>
    <ellipse cx="20" cy="19.5" rx="3.6" ry="4.2" fill="#0d0d0d"/>
  </g>

  <!-- Coin (ETH face) with soft shadow -->
  <g transform="translate(480 250)">
    <ellipse cx="0" cy="118" rx="70" ry="14" fill="#000" opacity="0.35"/>
    <circle r="92" fill="url(#coinFace)" stroke="#3e7a26" stroke-width="4"/>
    <circle r="78" fill="none" stroke="#0d0d0d" stroke-opacity="0.16" stroke-width="3"/>
    <g fill="#0d0d0d">
      <path d="M0 -50 -27 4 0 18 27 4z" opacity="0.92"/>
      <path d="M0 26 -27 10 0 54 27 10z" opacity="0.78"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="640" y="228" font-size="86" font-weight="800" letter-spacing="-2" fill="#ffffff">Accept <tspan fill="#8fd468">Crypto</tspan></text>
    <text x="644" y="292" font-size="44" font-weight="600" letter-spacing="1" fill="#c9c9c9">for WooCommerce</text>
    <text x="644" y="352" font-size="27" font-weight="500" letter-spacing="0.5" fill="#7f7f7f">ETH · USDC · USDT · Bitcoin — self-custodial, on-chain verified</text>
    <rect x="644" y="378" width="360" height="5" rx="2.5" fill="#8fd468"/>
    <text x="1024" y="382" font-size="20" font-weight="600" letter-spacing="0.5" fill="#5aa63c">by Shadow Software</text>
  </g>
</svg>
