<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Accept Crypto for WooCommerce — by Shadow Software">
  <title>Accept Crypto for WooCommerce — by Shadow Software</title>

  <defs>
    <!-- Dark brand backdrop with a green radial glow -->
    <radialGradient id="bg" cx="18%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#12351c"/>
      <stop offset="45%" stop-color="#0b0b0b"/>
      <stop offset="100%" stop-color="#060606"/>
    </radialGradient>

    <linearGradient id="coinFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b9f08a"/>
      <stop offset="50%" stop-color="#8fd468"/>
      <stop offset="100%" stop-color="#5aa63c"/>
    </linearGradient>

    <linearGradient id="coinEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f8f33"/>
      <stop offset="100%" stop-color="#2f5a1f"/>
    </linearGradient>

    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="card"><rect x="0" y="0" width="880" height="240" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="880" height="240" fill="url(#bg)"/>

    <!-- Faint hexagon lattice in the background -->
    <g stroke="#8fd468" stroke-opacity="0.06" fill="none" stroke-width="2">
      <path d="M120 40 154 60v40l-34 20-34-20V60z"/>
      <path d="M760 150 794 170v40l-34 20-34-20v-40z"/>
      <path d="M700 30 724 44v28l-24 14-24-14V44z"/>
    </g>

    <!-- ============ Shadow hexagon + hooded mark ============ -->
    <g transform="translate(70 60) scale(2.55)">
      <!-- Pulsing glow behind the mark -->
      <path d="M20 1.5 37 11.25v19.5L20 40.5 3 30.75v-19.5z" fill="#8fd468" opacity="0.0" filter="url(#soft)">
        <animate attributeName="opacity" values="0;0.35;0" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <path d="M20 1.5 37 11.25v19.5L20 40.5 3 30.75v-19.5z"
            fill="#0d0d0d" stroke="#8fd468" stroke-width="2" stroke-linejoin="round"/>
      <path d="M20 11c-4.4 0-7.8 3.3-7.8 8 0 2.6 1.1 4.7 2.6 6.2-1.7 1.1-2.9 2.7-3.3 4.8h17c-.4-2.1-1.6-3.7-3.3-4.8 1.5-1.5 2.6-3.6 2.6-6.2 0-4.7-3.4-8-7.8-8z"
            fill="#ededed"/>
      <ellipse cx="20" cy="19.5" rx="3.6" ry="4.2" fill="#0d0d0d"/>
    </g>

    <!-- ============ Flipping coin ============ -->
    <!-- The coin flips on its Y axis: ETH face -> thin edge -> BTC face, forever.
         Scaling the group's X simulates the 3D flip; symbols cross-fade with it. -->
    <g transform="translate(268 120)">
      <!-- soft drifting shadow under the coin -->
      <ellipse cx="0" cy="60" rx="34" ry="7" fill="#000" opacity="0.35">
        <animate attributeName="rx" values="34;26;34" dur="2.6s" repeatCount="indefinite"/>
      </ellipse>

      <g>
        <!-- gentle bob -->
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 0 -8; 0 0" dur="2.6s" repeatCount="indefinite"
                          calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

        <!-- the flip: horizontal squash/stretch -->
        <g>
          <animateTransform attributeName="transform" type="scale"
                            values="1 1; 0.06 1; 1 1; 0.06 1; 1 1" dur="4s"
                            repeatCount="indefinite" calcMode="spline"
                            keySplines="0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1"/>

          <!-- edge (visible when squashed) -->
          <rect x="-6" y="-46" width="12" height="92" rx="6" fill="url(#coinEdge)"/>

          <!-- ETH face -->
          <g>
            <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.2;0.25;0.7;0.75;1" dur="4s" repeatCount="indefinite"/>
            <circle r="46" fill="url(#coinFace)" stroke="#3e7a26" stroke-width="2"/>
            <circle r="39" fill="none" stroke="#0d0d0d" stroke-opacity="0.15" stroke-width="1.5"/>
            <!-- Ethereum diamond -->
            <g fill="#0d0d0d">
              <path d="M0 -26 -14 2 0 10 14 2z" opacity="0.9"/>
              <path d="M0 14 -14 6 0 28 14 6z" opacity="0.75"/>
            </g>
          </g>

          <!-- BTC face (shown mid-cycle) -->
          <g>
            <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.25;0.7;0.75;1" dur="4s" repeatCount="indefinite"/>
            <circle r="46" fill="url(#coinFace)" stroke="#3e7a26" stroke-width="2"/>
            <circle r="39" fill="none" stroke="#0d0d0d" stroke-opacity="0.15" stroke-width="1.5"/>
            <text x="0" y="17" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#0d0d0d">&#8383;</text>
          </g>
        </g>
      </g>
    </g>

    <!-- ============ Wordmark ============ -->
    <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="360" y="112" font-size="46" font-weight="800" letter-spacing="-1" fill="#ffffff">Accept <tspan fill="#8fd468">Crypto</tspan></text>
      <text x="362" y="150" font-size="23" font-weight="600" letter-spacing="0.5" fill="#c9c9c9">for WooCommerce</text>
      <text x="362" y="184" font-size="14.5" font-weight="500" letter-spacing="0.4" fill="#7f7f7f">ETH · USDC · USDT · Bitcoin — self-custodial, on-chain verified</text>
    </g>

    <!-- ============ Shimmer sweep (scroll-catcher) ============ -->
    <rect x="-260" y="0" width="180" height="240" fill="url(#shine)" opacity="0.5" transform="skewX(-18)">
      <animate attributeName="x" values="-260;1000" dur="4.5s" begin="0.6s" repeatCount="indefinite"/>
    </rect>

    <!-- green accent rule -->
    <rect x="360" y="200" width="0" height="3" rx="1.5" fill="#8fd468">
      <animate attributeName="width" values="0;300;300" keyTimes="0;0.4;1" dur="3s" begin="0.3s" fill="freeze"/>
    </rect>

    <!-- border -->
    <rect x="1" y="1" width="878" height="238" rx="19" fill="none" stroke="#232323" stroke-width="2"/>
  </g>
</svg>
