name: CI

# The full quality gate — coding standards, static analysis, and unit tests —
# runs on every push and pull request targeting the production branch.
#
# Note on PHP versions: the plugin RUNTIME supports PHP 8.0+, and that is enforced
# statically by PHPCompatibility (phpcs `testVersion: 8.0-`) and PHPStan, which
# flag anything that would break on 8.0 without needing to execute there. The dev
# tooling (PHPUnit 11) requires PHP 8.2+, so CI runs on 8.2 and 8.3.
on:
  push:
    branches: [ production ]
  pull_request:
    branches: [ production ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Analyse · Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, mbstring, json
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint — WordPress Coding Standards + PHP 8.0 compatibility
        run: composer lint

      - name: Static analysis — PHPStan (level 6)
        run: composer stan

      - name: Unit tests — PHPUnit
        run: composer test

  # A fast, dependency-free PHP 8.0 syntax gate so we always know the code at
  # least parses on the minimum supported runtime, even though the test tooling
  # cannot run there.
  php80-syntax:
    name: PHP 8.0 syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP 8.0
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - name: php -l on every PHP file (excluding vendor)
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          echo "All PHP files parse on PHP 8.0."
