name: CI

# The full quality gate — coding standards, static analysis, and unit tests —
# runs on every push and pull request targeting the production branch.
on:
  push:
    branches: [ production ]
  pull_request:
    branches: [ production ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Coding standards + static analysis run across the full supported PHP range
  # (8.0+), since the plugin RUNTIME must work there. These tools install fine on
  # 8.0. (The dev-only PHPUnit 11 needs PHP 8.2+, so tests run in a separate job.)
  lint-stan:
    name: Lint · Analyse (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.0', '8.1', '8.2', '8.3' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, mbstring, json
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-lint-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-lint-${{ matrix.php }}-

      # The dev PHPUnit 11 stack requires PHP 8.2+, but lint/stan never run it.
      # Ignore the PHP platform requirement at INSTALL time so the locked deps
      # resolve identically on 8.0/8.1 too; the tools themselves run fine there.
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-req=php+

      - name: Lint — WordPress Coding Standards + PHP compatibility
        run: composer lint

      - name: Static analysis — PHPStan
        run: composer stan

      - name: PHP syntax — php -l on every file
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

  # Unit tests run on the PHP versions PHPUnit 11 supports (8.2+).
  test:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, mbstring, json
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-test-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-test-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Unit tests — PHPUnit
        run: composer test
