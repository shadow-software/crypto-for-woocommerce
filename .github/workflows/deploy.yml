name: Deploy to WordPress.org

# Publishes a tagged release to the WordPress.org plugin directory:
#   * the plugin itself (respecting .gitattributes export-ignore), and
#   * the directory assets (icon + banner) from .wordpress-org/.
#
# Trigger: push a version tag on the production branch, e.g. `git tag 1.0.0 &&
# git push origin 1.0.0`.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   SVN_USERNAME  — your WordPress.org account username
#   SVN_PASSWORD  — your WordPress.org account password
# Until those are set, this workflow simply no-ops on tag pushes.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  deploy:
    name: Publish to WordPress.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — require WordPress.org credentials
        id: guard
        run: |
          if [ -z "${{ secrets.SVN_USERNAME }}" ] || [ -z "${{ secrets.SVN_PASSWORD }}" ]; then
            echo "WordPress.org SVN credentials are not configured; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy plugin + assets to WordPress.org
        if: steps.guard.outputs.ready == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: shadowledger-crypto-for-woocommerce
          ASSETS_DIR: .wordpress-org
